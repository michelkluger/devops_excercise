services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: psi-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: psi-backend
    environment:
      MEILI_URL: http://meilisearch:7700
      DATABASE_URL: sqlite:////app/data/vms.db
      SEED_DB: "1"
    depends_on:
      meilisearch:
        condition: service_healthy
    volumes:
      - db_data:/app/data

  frontend:
    build: ./frontend
    container_name: psi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  meili_data:
  db_data:
